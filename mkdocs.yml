# Project information
site_name: Machine Learning and Business Applications · Intensive Format
site_url: https://hizocar.github.io/usm-course-intensivo/
site_author: Sebastian Azocar
site_description: Intensive course on machine learning for business, USM, October to December 2026
repo_url: https://github.com/hizocar/usm-course-intensivo
repo_name: usm-course-intensivo
edit_uri: ""

# Markdown extensions
markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true   # lets pyrunner.js find the ```python blocks
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

# Extra javascript and css
# Math in the notebooks is typeset by the MathJax 2 that mkdocs-jupyter adds to
# each notebook page. Loading MathJax 3 as well made the two fight over
# window.MathJax, and instant navigation re-ran the notebook scripts.
extra_javascript:
  - javascripts/pyrunner.js
  - javascripts/hz-core.js
  - javascripts/explainers/list-index.js
  - javascripts/explainers/ndarray-slice.js
  - javascripts/explainers/groupby.js
  - javascripts/explainers/least-squares.js
  - javascripts/explainers/poly-fit.js
  - javascripts/explainers/kfold.js
  - javascripts/explainers/threshold.js
  - javascripts/explainers/tree-split.js
  - javascripts/explainers/roc.js
  - javascripts/mailbox.js
extra_css:
  - stylesheets/extra.css
  - stylesheets/interactive.css
  - stylesheets/pyrunner.css

# Theme
theme:
  name: material
  language: en
  logo: images/logo.bmp
  favicon: images/logo_python.svg
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hizocar

# Plugins
plugins:
  - mkdocs-jupyter:
      kernel_name: python3
  - search

# Navigation
nav:
  - Home: index.md
  - Schedule: schedule.md
  - Classes: classes/classes.md
  - Colab guide: colab.md
  - Final project:
      - Brief and rubric: project/project.md
      - Weekly progress: project/progress.md
      - Team mailbox: project/mailbox.md
  - Datasets: datasets/datasets.md
