[tool.poetry]
name = "docs"
version = "0.1.0"
description = "mkdocs - courses"
authors = ["Francisco Alfaro <francisco.alfaro.496@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
# Pinned to the versions the site has always been built with, so the rendered
# pages stay identical. Only compiled transitive dependencies (pyzmq, pyyaml,
# markupsafe...) float, because the old builds have no wheels for Python 3.12.
mkdocs = "1.3.0"
mkdocs-material = "8.2.15"
mkdocs-material-extensions = "1.0.3"
mkdocs-jupyter = "0.21.0"
pymdown-extensions = "9.4"
markdown = "3.3.7"
pygments = "2.12.0"
jinja2 = "3.1.2"
nbconvert = "6.5.0"
nbformat = "5.4.0"
mistune = "0.8.4"
jupytext = "1.14.0"
beautifulsoup4 = "4.11.1"
bleach = "5.0.1"
jupyterlab-pygments = "0.2.2"
